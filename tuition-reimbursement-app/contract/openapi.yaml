openapi: 3.1.0
info:
  title: Tuition Reimbursement API
  version: 0.1.0
  description: >-
    The source of truth for the HTTP API (ADR 0004). The backend implements it,
    and the TypeScript client and the in-browser mock API are generated from it.
    Endpoints are added one slice at a time; changing an existing endpoint is a
    deliberate, separate commit with a reason (ADR 0008).
servers:
  - url: /api
    description: The API, reached through the frontend's origin
tags:
  - name: platform
    description: Operations that prove the system is up and who is signed in
  - name: applications
    description: >-
      Applications, the Courses they are for, their status lifecycle and their
      Timelines
paths:
  /health:
    get:
      operationId: getHealth
      tags: [platform]
      summary: Report whether the system's dependencies are reachable
      description: >-
        Reports each dependency the app cannot work without, separately, so a
        failure says which one is down, and the instant the app's clock reads.
        Open to anyone: it is what tells a developer or a deployment that the
        system is up.
      security: []
      responses:
        "200":
          description: Every dependency is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one dependency is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /me:
    get:
      operationId: getMe
      tags: [platform]
      summary: The signed-in Person's identity, read from their token
      description: >-
        Answers who the caller is, taken from the claims in their token and never
        from a request parameter, so nobody can ask about someone else.
      responses:
        "200":
          description: The signed-in Person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: No valid token was presented
  /applications:
    post:
      operationId: createApplication
      tags: [applications]
      summary: Start an Application as a Draft
      description: >-
        Starts an Application for the signed-in Person, who becomes its
        Applicant. It begins as a Draft, so the Course details may be incomplete
        and may be filled in over several visits; completeness is only required
        at submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationDraft"
      responses:
        "201":
          description: The Draft as it was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: The Draft was refused, for example an Eligible Cost above the Course cost
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid token was presented
    get:
      operationId: listApplications
      tags: [applications]
      summary: The signed-in Person's own Applications
      description: >-
        Lists every Application the signed-in Person is the Applicant of, with
        each one's current status. It never contains anyone else's Application,
        and the Person is taken from the token rather than a parameter.
      responses:
        "200":
          description: The signed-in Person's Applications, most recently changed first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationSummary"
        "401":
          description: No valid token was presented
  /applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      operationId: getApplication
      tags: [applications]
      summary: One Application with its Timeline
      description: >-
        Reads one Application: its Course details, its current status and its
        Timeline, the ordered list of Status Changes with who made each one, when
        and why. Only the Applicant may read it in this slice.
      responses:
        "200":
          description: The Application and its Timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: No valid token was presented
        "404":
          description: >-
            No such Application, or it belongs to another Person. The two are not
            distinguished, so nobody can learn that someone else's Application
            exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Change a Draft
      description: >-
        Replaces the Course details and Eligible Cost of a Draft the signed-in
        Person is the Applicant of. Only a Draft can be changed, so an
        Application that has already been submitted is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationDraft"
      responses:
        "200":
          description: The Draft as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: The change was refused, for example an Eligible Cost above the Course cost
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid token was presented
        "404":
          description: No such Application, or it belongs to another Person
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The Application is no longer a Draft
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /applications/{applicationId}/submit:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit a Draft for Pre-approval
      description: >-
        Moves a Draft to Submitted and records the Status Change, with the
        Applicant as actor and the time from the application's clock. The
        Program requires Pre-approval before the Course starts, so an Application
        whose Course start date is today or earlier is refused and stays a Draft.
        Every required Course detail must be present.
      responses:
        "200":
          description: The Application, now Submitted, with its Timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: >-
            The Application cannot be submitted: a required Course detail is
            missing, or its Course has already started
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid token was presented
        "404":
          description: No such Application, or it belongs to another Person
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The Application has already been submitted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Cognito-issued JWT, validated as a standard OIDC resource server
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: The Application this operation is about
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      description: The reachability of each dependency, and the time the clock reads
      required: [status, postgres, s3, time]
      properties:
        status:
          type: string
          enum: [up, down]
          description: up only when every dependency is reachable
        postgres:
          $ref: "#/components/schemas/DependencyStatus"
        s3:
          $ref: "#/components/schemas/DependencyStatus"
        time:
          type: string
          format: date-time
          description: The instant the application's injected clock reads
    DependencyStatus:
      type: object
      description: Whether one dependency is reachable
      required: [reachable]
      properties:
        reachable:
          type: boolean
        detail:
          type: string
          description: Why it is unreachable, absent when it is
    Me:
      type: object
      description: The signed-in Person, as the backend read them from their token
      required: [personId, name, email]
      properties:
        personId:
          type: string
          description: The subject claim of the token, the Person's stable identifier
        name:
          type: string
          description: The Person's display name
        email:
          type: string
          format: email
    Amount:
      type: string
      pattern: "^[0-9]+\\.[0-9]{2}$"
      description: >-
        An amount of money in the Employer's single currency, as an exact decimal
        with two places. It is a string rather than a number so that no amount
        ever passes through a binary float: an Approved Amount and a Reimbursed
        Amount have to be exact to the cent.
      examples: ["1250.00"]
    ApplicationStatus:
      type: string
      description: >-
        Where an Application stands. This slice produces only draft and
        submitted; the rest of the lifecycle arrives with the slices that make
        those Status Changes possible.
      enum: [draft, submitted]
    Course:
      type: object
      description: >-
        The single class an Application is for. Every field is optional here
        because a Draft is filled in over time; submission is what requires the
        Course to be complete.
      properties:
        institution:
          type: string
          description: The school or college teaching the Course
        title:
          type: string
          description: What the Course is called
        startDate:
          type: string
          format: date
          description: >-
            The day the Course starts. The Program requires Pre-approval first,
            so an Application can only be submitted before this day.
        endDate:
          type: string
          format: date
          description: The day the Course ends, which later starts the Completion Window
        cost:
          $ref: "#/components/schemas/Amount"
        degreeProgram:
          type: string
          description: The degree program the Course belongs to, where it belongs to one
    ApplicationDraft:
      type: object
      description: The Course details and Eligible Cost an Applicant enters on a Draft
      required: [course]
      properties:
        course:
          $ref: "#/components/schemas/Course"
        eligibleCost:
          $ref: "#/components/schemas/Amount"
    StatusChange:
      type: object
      description: >-
        One recorded move of an Application from one status to another: who made
        it, when, and why. One entry of a Timeline.
      required: [to, actorName, at]
      properties:
        from:
          $ref: "#/components/schemas/ApplicationStatus"
        to:
          $ref: "#/components/schemas/ApplicationStatus"
        actorName:
          type: string
          description: >-
            The display name of the Person who made the Status Change, or the
            system where the system made it
        at:
          type: string
          format: date-time
          description: The instant it was made, from the application's injected clock
        reason:
          type: string
          description: >-
            Why it was made. Required for Rejected and Returned, which this slice
            does not reach, so it is normally absent here.
    ApplicationSummary:
      type: object
      description: >-
        One Application as it appears in the Applicant's own list: enough to
        recognise it and see where it stands, without its Timeline
      required: [applicationId, status, updatedAt]
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        courseTitle:
          type: string
          description: Absent while the Draft has no Course title yet
        courseInstitution:
          type: string
          description: Absent while the Draft has no institution yet
        courseStartDate:
          type: string
          format: date
          description: Absent while the Draft has no Course start date yet
        eligibleCost:
          $ref: "#/components/schemas/Amount"
        updatedAt:
          type: string
          format: date-time
          description: When the Application last changed
    Application:
      type: object
      description: One Application in full, with its Course details and its Timeline
      required: [applicationId, status, course, createdAt, updatedAt, timeline]
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        course:
          $ref: "#/components/schemas/Course"
        eligibleCost:
          $ref: "#/components/schemas/Amount"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        timeline:
          type: array
          description: Every Status Change on this Application, oldest first
          items:
            $ref: "#/components/schemas/StatusChange"
    Problem:
      type: object
      description: >-
        Why a request was refused, in the shape of RFC 9457, so that a screen can
        tell the Applicant what to fix rather than that something went wrong
      required: [title, status]
      properties:
        title:
          type: string
          description: A short, human-readable summary of the refusal
        status:
          type: integer
          description: The HTTP status code, repeated so the body stands alone
        detail:
          type: string
          description: What was wrong with this particular request
        violations:
          type: array
          description: >-
            The individual fields at fault, where the refusal is about particular
            fields, so a form can mark each one
          items:
            $ref: "#/components/schemas/Violation"
    Violation:
      type: object
      description: One field at fault and what is wrong with it
      required: [field, message]
      properties:
        field:
          type: string
          description: The field's name in the request body, for example course.startDate
        message:
          type: string
          description: What is wrong with it, in the Applicant's language

security:
  - cognito: []
