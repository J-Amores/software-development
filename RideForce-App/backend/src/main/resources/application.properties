spring.application.name=rideforce-backend
spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rideforce}
spring.datasource.username=${POSTGRES_USER:rideforce}
spring.datasource.password=${POSTGRES_PASSWORD:rideforce_secret}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
