# RideForce Stage 2 topology (ADR-0002). Start with: scripts/up.sh
#
# aws-emulator's TLS certificate is only valid for 127.0.0.1/localhost, so api, worker and
# terraform join the emulator's network namespace (network_mode: service:aws-emulator) and call
# https://127.0.0.1:9297 with verification on. Ports for those services are therefore published
# on the aws-emulator service, bound to host loopback only.

x-aws-client-env: &aws-client-env
  AWS_ENDPOINT_URL: https://127.0.0.1:9297
  AWS_SHARED_CREDENTIALS_FILE: /aws/emulator_credentials
  AWS_CONFIG_FILE: /aws/config
  AWS_CA_BUNDLE: /aws/ca.pem
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"

x-aws-client-volume: &aws-client-volume "${HOME}/.aws/emulator/9297:/aws:ro"

services:
  aws-emulator:
    build: ./infra/aws-emulator
    image: rideforce-aws-emulator
    environment:
      EMULATOR_TELEMETRY: "off"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    ports:
      - "127.0.0.1:9297:9297" # emulator (host AWS CLI / SDK)
      - "127.0.0.1:8000:8000" # api (shares this network namespace)
    volumes:
      - "${HOME}/.aws/emulator/9297:/home/emulator/.aws/emulator/9297"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--cacert", "/home/emulator/.aws/emulator/9297/ca.pem", "https://127.0.0.1:9297/__admin/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  terraform:
    build:
      context: ./infra/terraform
      additional_contexts:
        manifest: ./backend/rideforce
    image: rideforce-terraform
    network_mode: service:aws-emulator
    depends_on:
      aws-emulator:
        condition: service_healthy
    environment:
      <<: *aws-client-env
      TF_IN_AUTOMATION: "1"
      TF_DATA_DIR: /state/.terraform
      TF_PLUGIN_CACHE_DIR: /state/plugin-cache
    # Idempotent on every boot: state persists in the tfstate volume, refresh notices the
    # emulator's in-memory resources are gone after a restart and recreates them.
    volumes:
      - *aws-client-volume
      - tfstate:/state

  api:
    build:
      context: ./backend
      target: runtime
    image: rideforce-backend
    network_mode: service:aws-emulator
    depends_on:
      terraform:
        condition: service_completed_successfully
    environment:
      <<: *aws-client-env
    volumes:
      - *aws-client-volume
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    image: rideforce-backend
    network_mode: service:aws-emulator
    depends_on:
      terraform:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      <<: *aws-client-env
    command: ["python", "-m", "rideforce.worker"]
    volumes:
      - *aws-client-volume

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DISPATCH_GATEWAY: http
    image: rideforce-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tfstate:
