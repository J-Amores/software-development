server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;

    # api shares the aws-emulator network namespace, so it is reached by that service name.
    location /api/ {
        proxy_pass http://aws-emulator:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Server-Sent Events: no buffering, long-lived connection.
    location = /api/stream {
        proxy_pass http://aws-emulator:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
