name: RideForce Verification

on:
  push:
    paths:
      - 'RideForce-App/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'RideForce-App/**'
      - '.github/workflows/verify.yml'

jobs:
  shellcheck:
    name: Lint Scripts (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          if [ -d "RideForce-App" ]; then cd RideForce-App; fi
          shellcheck scripts/*.sh

  backend-tests:
    name: Seam 1 - Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests
        run: |
          if [ -d "RideForce-App" ]; then cd RideForce-App; fi
          cd backend
          mvn test

  gateway-verification:
    name: Seam 2 - Unified Gateway Verification
    runs-on: ubuntu-latest
    needs: [shellcheck, backend-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Docker Compose Stack
        run: |
          if [ -d "RideForce-App" ]; then cd RideForce-App; fi
          cp .env.example .env
          docker compose up -d --build

      - name: Run Platform Verification Script
        run: |
          if [ -d "RideForce-App" ]; then cd RideForce-App; fi
          bash scripts/verify.sh

      - name: Output Container Logs on Failure
        if: failure()
        run: |
          if [ -d "RideForce-App" ]; then cd RideForce-App; fi
          docker compose logs

      - name: Teardown Stack
        if: always()
        run: |
          if [ -d "RideForce-App" ]; then cd RideForce-App; fi
          docker compose down -v
