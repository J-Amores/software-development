name: Tuition Reimbursement Verification

on:
  push:
    paths:
      - 'tuition-reimbursement-app/**'
      - '.github/workflows/tuition.yml'
  pull_request:
    paths:
      - 'tuition-reimbursement-app/**'
      - '.github/workflows/tuition.yml'

# Every step runs in the same container the developer runs it in, so nothing
# depends on what the runner image happens to have installed (home repo rule:
# reproducible execution).
defaults:
  run:
    working-directory: tuition-reimbursement-app

jobs:
  contract:
    name: Contract is the source of truth
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install the contract's tools
        run: npm --prefix contract install --no-audit --no-fund
      - name: Lint the OpenAPI spec
        run: npm --prefix contract run lint
      - name: Check the generated client matches the contract
        run: npm --prefix contract run check

  scripts:
    name: Scripts lint
    runs-on: ubuntu-latest
    container: koalaman/shellcheck-alpine:stable
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck dev tools/ci/*.sh tools/aws-emulator/seed.sh backend/entrypoint.sh web/e2e/*.sh web/entrypoint.sh

  guards:
    name: Tests read-only, and SQL Aurora DSQL supports
    runs-on: ubuntu-latest
    steps:
      # These two guards are shell and git only: the runner's own git is what
      # reads the history, so there is nothing to containerize.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No commit weakens a test to make code pass
        working-directory: .
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against; nothing to check."
            exit 0
          fi
          tuition-reimbursement-app/tools/ci/check-tests-read-only.sh "$base...${{ github.sha }}"
      - name: Every migration stays inside Aurora DSQL's SQL
        working-directory: .
        run: tuition-reimbursement-app/tools/ci/check-dsql-sql.sh

  backend:
    name: Backend, against real Postgres and the AWS Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the AWS Emulator
        # The same service definition the developer runs, so the emulator is
        # configured in one place only (docker-compose.yml).
        run: |
          mkdir -p "$HOME/.aws/emulator/9297"
          docker compose up --build -d --wait aws-emulator
      - name: Run the suite
        # Maven and the JDK come from the image, not the runner. Postgres comes
        # from Testcontainers, which reaches the runner's Docker socket. No real
        # AWS credentials are in the environment: without the endpoint below, a
        # call would go to live AWS.
        run: |
          docker run --rm \
            -v "$PWD":/w -w /w/backend \
            -v "$HOME/.m2":/root/.m2 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.aws/emulator/9297":/emulator:ro \
            -e AWS_ENDPOINT_URL=https://127.0.0.1:9297 \
            -e AWS_CA_BUNDLE=/emulator/ca.pem \
            -e AWS_SHARED_CREDENTIALS_FILE=/emulator/emulator_credentials \
            -e AWS_REGION=us-east-1 \
            -e AWS_EC2_METADATA_DISABLED=true \
            -e TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
            --add-host host.docker.internal:host-gateway \
            --network container:tuition-aws-emulator \
            maven:3.9.12-eclipse-temurin-25 mvn -B verify
      - name: Container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the emulator
        if: always()
        run: docker compose down -v || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - run: npm --prefix web ci --no-audit --no-fund
      - name: Typecheck
        run: npm --prefix web run typecheck
      - name: Test
        run: npm --prefix web test
      - name: Build, and build demo mode
        run: |
          npm --prefix web run build
          npm --prefix web run build:demo
